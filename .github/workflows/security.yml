name: Security 🔒

on:
  pull_request: ~
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  composer-audit:
    name: 📦 Composer audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Composer install
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest

      - name: Audit dependencies
        run: composer audit --locked

  secret-scan:
    name: 🕵️ Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The official action requires a paid licence for organisation
      # repositories; the gitleaks binary itself is free, so it is pinned and
      # run directly.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks version

      - name: Scan the working tree and the full history
        run: |
          ./gitleaks dir . --redact --no-banner --verbose
          ./gitleaks git . --redact --no-banner --verbose
